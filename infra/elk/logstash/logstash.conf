input {
  file {
    path => "/var/log/docker_logs/**/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    ignore_older => 0
    codec => "json"
  }
}

filter {
  if [attrs][tag] == "logstash-internal" {
    drop { }
  }

  if [log] {
    mutate { rename => { "log" => "message" } }
  }

  date {
    match => [ "time", "ISO8601" ]
    target => "@timestamp"
  }

  if [attrs][tag] == "nginx" {
    mutate { add_field => { "service" => "nginx" } }
  } else if [attrs][tag] == "backend_api" {
    mutate { add_field => { "service" => "backend" } }
  } else {
    mutate { add_field => { "service" => "unknown_system" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "appdata-%{service}-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    data_stream => false
  }
}
