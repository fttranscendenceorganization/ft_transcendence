server {
	listen 80;
	server_name ${DOMAIN_NAME};
	location /health {
        access_log off;
        return 200 "alive: true\n";
    }
	location / {
        return 301 https://$host$request_uri;
    }
}

server {
	listen 443 ssl;
	server_name  ${DOMAIN_NAME};

	ssl_certificate /etc/ssl/nginx.crt;
    ssl_certificate_key /etc/ssl/nginx.key;

	ssl_protocols  	TLSv1.2  TLSv1.3;
	ssl_prefer_server_ciphers on;

	location  / {
		proxy_intercept_errors on;
        error_page 404 = /index.html;
		proxy_pass http://front_end:80;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
	location = /index.html {
        proxy_pass http://front_end:80/index.html;
    }
    	
    	location /socket.io/ {
		proxy_pass http://backend_api:3000/socket.io/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /api/ {
		proxy_pass http://backend_api:3000/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
	location /uploads/avatars/ {
		proxy_pass http://backend_api:3000/uploads/avatars/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_cache_valid 200 1h;
		expires 1h;
		add_header Cache-Control "public, max-age=3600";
	}
	location /health {
        access_log off;
        return 200 "alive: true\n";
    }
	location /status {
    	proxy_pass http://status_service:3000/status/ui;
    	proxy_set_header Host $host;
	}
	location /status/api {
		proxy_pass http://status_service:3000/status;
		proxy_set_header Host $host;
	}
	location /grafana/ {
		proxy_pass http://grafana:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
	# location /kibana/ {
	# 	proxy_pass http://kibana:5601;
	# 	proxy_set_header Host $host;
	# 	proxy_set_header X-Real-IP $remote_addr;
	# 	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	# 	proxy_set_header X-Forwarded-Proto $scheme;
	# }
	location ~ ^/api/health {
		allow 172.18.0.0/16;
		allow 172.19.0.0/16;
		allow 172.20.0.0/16;
		allow 172.21.0.0/16;
    	deny all;
		
		proxy_pass http://backend_api:3000;
	}
	
}